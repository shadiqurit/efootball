# Include inside the existing http {} block, alongside the IPI EMP site.
# The certificate must cover efootball.shadiqur.bd (or *.shadiqur.bd).
server {
    listen 80;
    server_name efootball.shadiqur.bd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name efootball.shadiqur.bd;

    ssl_certificate     C:/nginx/ssl/shadiqur.bd.crt;
    ssl_certificate_key C:/nginx/ssl/shadiqur.bd.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    root D:/app/efootball/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
        proxy_redirect off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3005/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
